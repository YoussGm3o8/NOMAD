# NOMAD developer / simulation environment.
#
# Pixi (https://pixi.sh) provides a reproducible, cross-platform dev environment
# that does NOT require the Jetson or a GPU. The C++ core and optional ROS2/
# simulation images are built separately when their tasks are selected.
#
# Quick start:
#   pixi run dev      # build the C++ core
#   pixi run test-python  # pytest
#   pixi run lint         # ruff check
#   pixi run format       # ruff format
#   pixi run docs     # serve the docs site locally

[workspace]
name = "nomad"
version = "0.2.1"
description = "NOMAD C++ core and Python tools — development environment"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

# ==================== Features ====================

[feature.dev.dependencies]
python = "3.13.*"
pre-commit = ">=3.8"
shellcheck = ">=0.10"

[feature.dev.pypi-dependencies]
nomad-edge = { path = ".", editable = true, extras = ["dev", "docs"] }

# Isaac Sim (Omniverse) integration is intentionally not included in this
# baseline — it needs a high-end NVIDIA GPU host. It will return later as a
# remote simulation server. The hardware-free ArduPilot SITL stack below covers
# local development without a GPU.

# ==================== Environments ====================

[environments]
default = { features = ["dev"] }

# ==================== Tasks ====================

[tasks]

# C++ core target. The compiler is intentionally a host prerequisite.
build-core = "cmake -S . -B build/core -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON && cmake --build build/core"
# Regenerate the MAVLink C headers from the pinned third_party/ardupilot-mavlink
# submodule (build/generated/mavlink, gitignored). build-core does this
# automatically; run this task explicitly after updating the submodule pin.
generate-mavlink = "python scripts/dev/generate_mavlink.py"
test-core = "cmake -S . -B build/core -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON && cmake --build build/core && ctest --test-dir build/core -C Debug --output-on-failure"
sitl = "pixi run dev-build && pixi run dev-up && pixi run sitl-scenario"
# Optional MAVSDK Phase A build. The default `build-core` remains the legacy
# codec until the MAVSDK parity and deletion gates close.
build-core-mavsdk = "python scripts/dev/mavsdk_phase_a_metrics.py --build"
mavsdk-phase-a-smoke = "pixi run build-core-mavsdk && python scripts/dev/mavsdk_phase_a_smoke.py"
test-mavsdk-phase-a = "pytest tests/test_mavsdk_phase_a_smoke.py tests/test_mavsdk_provenance.py -q && python scripts/dev/mavsdk_phase_a_fixture.py"
check-mavsdk-phase-a = "python scripts/dev/check_mavsdk_phase_a.py"

# Phase A's SITL task is opt-in and never changes the default core path.
# `dev` remains as a compatibility task for existing contributor workflows.
dev = "pixi run build-core"
# Coverage floor is a ratchet set just below the current level so coverage can
# only trend up; raise it as more of the codebase gets tested.
test = "pytest --cov=python --cov=infra/tailscale --cov-report=term-missing --cov-fail-under=85"
# Plain pytest without the coverage gate (handy for running a single test file).
test-fast = "pytest"
test-python = "pytest"

# Hardware-free SITL stack (Docker), no Isaac Sim.
#   pixi run dev-up      # start ArduPilot SITL and the Mission Planner bridge
#   pixi run dev-down    # stop and remove
# Mission Planner connects to SITL via TCP 127.0.0.1:5762 (the mp_bridge
# socat relay — 5760 is single-client and held by the in-container MAVProxy).
dev-build = "pixi run build-core"
dev-up = "docker compose -f docker/docker-compose.dev.yml --profile sitl up -d --build"
dev-down = "docker compose -f docker/docker-compose.dev.yml --profile sitl down"
dev-logs = "docker compose -f docker/docker-compose.dev.yml --profile sitl logs -f"
dev-ps = "docker compose -f docker/docker-compose.dev.yml --profile sitl ps"
# SITL loop-closure scenario for the safety-critical velocity core (needs the
# dev+sitl stack up: `pixi run dev-up`). The scenario drives the C++ core CLI
# on the host (its UDP copy of the stream arrives on NOMAD_CORE_SITL_PORT) and
# observes the vehicle over the operator link. See tests/sitl/README.md.
# The C++ telemetry smoke test runs the same way: `pixi run core-sitl-status`.
# (Declared as a table task with env below, with the other C++ SITL runners.)
# Geofence containment scenario (SR-FEN-02): the C++ core CLI drives the
# vehicle (mode/arm/takeoff/goto under the projected fence) against the same
# host-side SITL UDP copy the other core-sitl-* scenarios use.
sitl-fence = "python scripts/dev/core_sitl_containment.py"
# ROS2 simulation stack (Tier 1 — CPU, no GPU/Jetson required).
#   pixi run sim-ros-build   # build the nomad-sim-ros:latest image (run once)
#   pixi run sim-ros-up      # start SITL + nomad_vehicle_node only (detached)
#   pixi run sim-ros-down    # stop and remove the ros-profile containers
#   pixi run sim-ros-logs    # tail logs from all ros-profile services
#   pixi run test-ros-integration  # end-to-end adapter test (needs sim-ros-build first)
sim-ros-build = "docker build -f docker/Dockerfile.sim-ros -t nomad-sim-ros:latest ."
sim-ros-down = "docker compose -p nomad-ros -f docker/docker-compose.dev.yml --profile ros down"
sim-ros-logs = "docker compose -p nomad-ros -f docker/docker-compose.dev.yml --profile ros logs -f"
# Runs the integration test INSIDE the sim-ros image (rclpy + pytest present in
# the image; nomad_core + nomad_ros compiled into a colcon workspace).
# Volume-mounts tests/ so the test suite is always current code. Exercises the
# REAL nomad_vehicle_node (C++) against an in-process MAVLink responder with
# generic test-VIO + cmd_vel publishers. Requires: pixi run sim-ros-build
test-ros-integration = """
docker run --rm -v $PWD/tests:/opt/nomad/tests nomad-sim-ros:latest python3 -m pytest tests/ros/ -v
"""
# Optional flight simulation (Tier 3 — ArduPilot SITL + visible Gazebo).
# This is deliberately separate from the default ROS adapter path and does not
# constitute VIO or obstacle-avoidance evidence.
# Image/Compose scaffolding remains for future qualification. The current image
# has no active simulator launch/provider; startup tasks report unavailable.
#
#   pixi run sim-gazebo-build  # build the nomad-sim-gazebo:latest image (run once)
#   pixi run sim-gazebo-up     # reports unavailable until launch/provider qualification
#   pixi run sim-gazebo-open   # open the noVNC Gazebo GUI in your browser
#   pixi run sim-gazebo-up-headless  # reports unavailable
#   pixi run sim-gazebo-up-fast      # reports unavailable
#   pixi run sim-gazebo-down   # stop and remove the gazebo-profile containers
#   pixi run sim-gazebo-logs   # tail logs from all gazebo-profile services
#
# Depth topics are simulation-only and are not connected to the vehicle adapter
# unless a future estimator explicitly consumes them.
sim-gazebo-build = "docker build -f docker/Dockerfile.sim-gazebo -t nomad-sim-gazebo:latest ."
sim-gazebo-open = "python -m webbrowser http://localhost:6080/vnc.html"
sim-gazebo-down = "docker compose -p nomad-gazebo -f docker/docker-compose.dev.yml --profile gazebo down"
sim-gazebo-logs = "docker compose -p nomad-gazebo -f docker/docker-compose.dev.yml --profile gazebo logs -f"
sim-gazebo-ps = "docker compose -p nomad-gazebo -f docker/docker-compose.dev.yml --profile gazebo ps"

# ROS telemetry is usable independently of a sensor publisher.
"sim-ros-up".cmd = "docker compose -p nomad-ros -f docker/docker-compose.dev.yml --profile ros up -d --build"
"sim-ros-up".env.NOMAD_SITL_ROS_OUTPUT = "--out udp:nomad_vehicle_node:14552"

# Preserve task names, but fail before starting an incomplete sensor stack.
# debt: no simulation sensor provider; revisit at G3 capture selection; then
# connect and qualify an explicit publisher before enabling these entrypoints.
sim-ros-perception-up = """python -c "raise SystemExit('Unavailable: simulation sensor/launch provider is not configured; see docs/development.md')""""
sim-gazebo-up = """python -c "raise SystemExit('Unavailable: simulation sensor/launch provider is not configured; see docs/development.md')""""
sim-gazebo-up-headless = """python -c "raise SystemExit('Unavailable: simulation sensor/launch provider is not configured; see docs/development.md')""""
sim-gazebo-up-fast = """python -c "raise SystemExit('Unavailable: simulation sensor/launch provider is not configured; see docs/development.md')""""

lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
fmt = "pixi run format"
fmt-check = "pixi run format-check"
line-report = "python scripts/dev/line_report.py"
complexity-check = "python scripts/dev/line_report.py --changed-only --fail-over-file-limit --fail-over-function-limit"
# Whole-tree Python type check — advisory during the C++ migration.
typecheck = "mypy"

# Documentation preview served on :8001.
docs = "properdocs serve --dev-addr localhost:8001"
docs-build = "properdocs build --strict"

# Git hooks
precommit = "pre-commit run --all-files"

# Bootstrap (run once when first cloning)
bootstrap = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup/bootstrap.ps1"

# Build the Mission Planner plugin (Windows only)
build-plugin = "powershell -ExecutionPolicy Bypass -File scripts/build/build_plugin_windows.ps1"

# Dead-code lint for the plugin (Windows only) — fails on unused fields/locals,
# unreachable code, etc. (C# compiler diagnostics promoted to errors).
lint-plugin = "powershell -ExecutionPolicy Bypass -File scripts/build/lint_plugin_deadcode.ps1"

# Unit tests for the plugin's geofence geometry (Windows only) — compiles the
# Mission Planner-free GeoMath/GeofenceTypes with VS's csc and runs assertions
# on polygon inset, point-in-polygon, and nearest-inside-point math.
test-plugin-geometry = "powershell -ExecutionPolicy Bypass -File scripts/build/test_plugin_geometry.ps1"

# Unit tests for the plugin's safety-critical payload-release interlock (Windows
# only) — compiles the Mission Planner-free PayloadReleaseInterlock with VS's csc
# and asserts the multi-click arm/confirm, rolling-window expiry, backwards-clock,
# and reset behaviour (the GCS counterpart of tests/test_safety_payload.py).
test-plugin-interlock = "powershell -ExecutionPolicy Bypass -File scripts/build/test_plugin_interlock.ps1"

# Unit tests for the gimbal command core (Windows only) — compiles the Mission
# Planner-free GimbalCommand with VS's csc and asserts the exact MAVLink it emits
# (DO_MOUNT_CONTROL/DO_MOUNT_CONFIGURE command ids + param layout, MAV_MOUNT_MODE
# values) plus the stick-integration and angle-clamping math.
test-plugin-gimbal = "powershell -ExecutionPolicy Bypass -File scripts/build/test_plugin_gimbal.ps1"

# Unit tests for the NomadCoreClient boundary (Windows only) — compiles the
# Mission Planner-free NomadCoreClient with VS's csc and pins the exact argument
# vector the plugin sends to the C++ core CLI (values then --endpoint, invariant
# formatting), the fail-closed input validation gates, and the unavailable-core
# failure path. When the C++ binary is built it also exercises the live
# authentication gate (actuation without NOMAD_API_KEY is refused before any
# socket work).
test-plugin-core-client = "powershell -ExecutionPolicy Bypass -File scripts/build/test_plugin_core_client.ps1"

# Unit tests for the host-independent flight-log analyzer and shared live issue rules.
test-plugin-logs = "powershell -ExecutionPolicy Bypass -File scripts/build/test_plugin_logs.ps1"

# Unit tests for the Airbus-style altitude callouts (Windows only) — compiles the
# Mission Planner-free AltitudeCallout with VS's csc and asserts the threshold-
# crossing logic: silent priming, climb/descent callouts, hysteresis deadband,
# and nearest-threshold selection on a fast multi-band descent.
test-plugin-audio = "powershell -ExecutionPolicy Bypass -File scripts/build/test_plugin_audio.ps1"

# Runtime smoke test for Mission Planner's DFLogBuffer adapter (requires a Release plugin build).
test-plugin-log-adapters = "powershell -ExecutionPolicy Bypass -File scripts/build/test_plugin_log_adapters.ps1"

# Stress/behaviour tests for the dual-link MAVLink router (Windows only) —
# compiles the Mission Planner-free GroundLinkRouter stack with VS's csc and
# runs it against real loopback UDP sockets: frame parsing, cross-link dedup,
# failover + preferred-link recovery, manual override, outbound single-link
# routing, param-transaction pinning, watchdog socket reopen, and high-rate
# mirrored stress with strict no-loss/no-duplication assertions.
test-plugin-duallink = "powershell -ExecutionPolicy Bypass -File scripts/build/test_plugin_duallink.ps1"

# ==================== Configuration Profiles ====================
# Manage config/nomad.env via named profiles stored in config/profiles/.
# Each profile is a complete environment file with all settings for a
# specific deployment target (real drone, minimal dev).
#
# Quick start:
#   pixi run profile-load onboard_companion  # Optional onboard compute placement
#   pixi run profile-load groundstation_minimal  # Direct MAVLink + C++ core
#   pixi run profile-show           # Show active profile
#   pixi run profile-list           # List available profiles

# Cross-platform profile manager (runs in the pixi Python env so it works on
# Windows/macOS/Linux without bash). `nomad-profile` (bash) remains for the
# Jetson runtime.
profile-load = { cmd = "python scripts/profile.py load {{ profile }}", args = [
    "profile",
] }
profile-save = { cmd = "python scripts/profile.py save {{ profile }}", args = [
    "profile",
] }
profile-list = "python scripts/profile.py list"
profile-show = "python scripts/profile.py show"
profile-diff = { cmd = "python scripts/profile.py diff {{ profile }}", args = [
    "profile",
] }
profile-edit = "python scripts/profile.py edit"

# C++ SITL runners. The CLI refuses actuation verbs without NOMAD_API_KEY
# (SR-SEC-02/03); the key below is the documented development-simulation key
# from config/nomad.env.example, never a production credential.
[tasks.core-sitl-status]
cmd = "pixi run build-core && python scripts/dev/core_sitl_status.py"
env = { NOMAD_API_KEY = "nomad-dev-sitl-key" }

[tasks.core-sitl-command-flow]
cmd = "pixi run build-core && python scripts/dev/core_sitl_command_flow.py"
env = { NOMAD_API_KEY = "nomad-dev-sitl-key" }

[tasks.core-sitl-mission]
cmd = "pixi run build-core && python scripts/dev/core_sitl_mission.py"
env = { NOMAD_API_KEY = "nomad-dev-sitl-key" }

[tasks.core-sitl-velocity-watchdog]
cmd = "pixi run build-core && python scripts/dev/core_sitl_velocity_watchdog.py"
env = { NOMAD_API_KEY = "nomad-dev-sitl-key" }

[tasks.core-sitl-geofence]
cmd = "pixi run build-core && python scripts/dev/core_sitl_geofence.py"
env = { NOMAD_API_KEY = "nomad-dev-sitl-key" }

[tasks.core-sitl-payload]
cmd = "pixi run build-core && python scripts/dev/core_sitl_payload.py"
env = { NOMAD_API_KEY = "nomad-dev-sitl-key" }

[tasks.core-sitl-link-loss]
cmd = "pixi run build-core && python scripts/dev/core_sitl_link_loss.py"
env = { NOMAD_API_KEY = "nomad-dev-sitl-key" }

[tasks.core-sitl-zero-delivery]
# Observes the CLI's wire setpoints through a tee relay (the relay binds the
# always-on 14572 copy as its upstream, like the link-recovery scenario).
cmd = "pixi run build-core && python scripts/dev/core_sitl_zero_delivery.py"
env = { NOMAD_API_KEY = "nomad-dev-sitl-key", NOMAD_CORE_SITL_PORT = "14572" }

[tasks.core-sitl-gcs-heartbeat]
# The relay binds the always-on 14572 copy as its upstream (see
# docker-compose.dev.yml), like the link-recovery scenario.
cmd = "pixi run build-core && python scripts/dev/core_sitl_gcs_heartbeat.py"
env = { NOMAD_API_KEY = "nomad-dev-sitl-key" }

[tasks.sitl-scenario]
cmd = "python tests/sitl/velocity_loop_closure.py"
env = { NOMAD_SITL_OPERATOR = "tcp:127.0.0.1:5762", NOMAD_API_KEY = "nomad-dev-sitl-key" }

[tasks.core-sitl-link-recovery]
# The relay binds 14572 as its upstream; the dev stack always forwards a
# MAVLink copy there (see SITL_UDP_OUTPUT_ADDRESS in docker-compose.dev.yml),
# so this task works without restarting the stack with special env.
cmd = "pixi run build-core && python scripts/dev/core_sitl_link_recovery.py"
env = { NOMAD_API_KEY = "nomad-dev-sitl-key", NOMAD_CORE_SITL_PORT = "14572" }
