name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (sim path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
      - name: Run Python tests
        run: pixi run test-python

  core:
    name: C++ core
    runs-on: ubuntu-latest
    steps:
      # The C++ codec compiles against headers generated from the pinned
      # third_party/ardupilot-mavlink submodule (see scripts/dev/generate_mavlink.py).
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
      - name: Build and test C++ core
        run: pixi run test-core

  mavsdk-phase-a:
    name: MAVSDK Phase A (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
      - name: Build optional MAVSDK smoke target
        run: pixi run build-core-mavsdk
